# Builds her Windows installer on every push to main (or by hand: Actions > Build Capri > Run
# workflow) and puts it on the "latest" release: download Capri-Setup-x.y.z.exe there, run it.
name: Build Capri

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: |
          npm run test:hooks
          npm run test:voice
          npm run test:llm
          npm run test:chat
          npm run test:skills

      - name: Installer
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: Capri-Setup
          path: dist/Capri-Setup-*.exe

      - name: Latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Capri-Setup-*.exe \
            --title "Capri (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download Capri-Setup-*.exe below and run it. See SETUP.md." \
            --prerelease
